version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    # The runtime is pinned to Node 24 (`engines.node` in package.json,
    # `.nvmrc`), so its type definitions must not move past the 24.x line.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      fastify:
        applies-to: version-updates
        patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
      fastify-security:
        applies-to: security-updates
        patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
      # vitest is pinned exactly in tools/verify-coverage.mjs (PINNED_TOOLCHAIN)
      # and in tests/fixtures/assembly-cohort.json (coveragePolicy.toolchain),
      # so a bump fails `check:preflight` until both pins are updated and the
      # coverage cohort is re-measured. Keep it in its own PR so it never
      # blocks the rest of the minor/patch or security batch.
      vitest-toolchain:
        applies-to: version-updates
        patterns:
          - vitest
          - "@vitest/*"
      vitest-toolchain-security:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/*"
      # All other deps: batch minor+patch weekly; majors stay individual PRs
      # for deliberate review.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
          - vitest
          - "@vitest/*"

  # github-actions version updates — NEW capability (nothing existed for
  # actions before this config); grouped into one weekly PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        patterns:
          - "*"
