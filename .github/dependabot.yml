version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # The runtime is pinned to Node 24 (`engines.node` in package.json,
    # `.nvmrc`), so its type definitions must not move past the 24.x line.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      fastify:
        applies-to: version-updates
        patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
      fastify-security:
        applies-to: security-updates
        patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
      # All other deps: batch minor+patch weekly; majors stay individual PRs
      # for deliberate review.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - fastify
          - "@fastify/*"
          - "fastify-*"
          - find-my-way
          - fast-uri

  # github-actions version updates — NEW capability (nothing existed for
  # actions before this config); grouped into one weekly PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
