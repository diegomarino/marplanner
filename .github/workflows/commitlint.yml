name: Conventional Commits
"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Pull requests are squash-merged, so the title becomes the commit subject on
  # main. This is the check that guards main's history.
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      # Only commitlint is needed, so no package install script runs.
      - run: npm ci --ignore-scripts
      # The title is untrusted input: pass it through the environment, never
      # interpolate it into the script.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose
  commits:
    name: PR commits
    # Editing the title or body does not change the commits.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
      # Merge commits such as "Merge branch 'main' into ..." are skipped by
      # commitlint's default ignores.
      - name: Lint the commits of the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
