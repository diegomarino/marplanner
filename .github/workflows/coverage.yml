name: Product quality and coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 11.19.0
      - run: npm ci
      - run: echo "MP_CANDIDATE_ID=$(node tools/candidate-identity.mjs)" >> "$GITHUB_ENV"
      - run: npm run check:standard
      - name: Retain raw discovery, results and V8 coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standard-evidence
          path: |
            .quality/
            coverage/
          if-no-files-found: error
