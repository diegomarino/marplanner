name: Built application gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: test "$(node --version)" = v24.21.0 && test "$(npm --version)" = 11.19.0
      - run: npm ci
      - run: echo "MP_CANDIDATE_ID=$(node tools/candidate-identity.mjs)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check:full
      - name: Build production container (runner architecture only)
        run: docker build -f infra/docker/Dockerfile --label org.marplanner.candidate="$MP_CANDIDATE_ID" --label org.opencontainers.image.revision="$GITHUB_SHA" -t marplanner:review .
      - name: Accept built container lifecycle and browser flow
        run: npm run check:container -- --image marplanner:review
      - name: Retain raw discovery, results, V8 coverage and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence
          path: |
            .quality/
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: error
