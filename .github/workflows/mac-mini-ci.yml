name: Mac mini runner verification
"on":
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_hosted:
        description: Use GitHub-hosted execution instead of waiting for the Mac mini
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_hosted:
        type: boolean
        default: false
      selector_only:
        type: boolean
        default: true
    outputs:
      runner:
        description: Selected native runner labels
        value: ${{ jobs.select.outputs.runner }}
      container_runner:
        description: Selected container runner labels
        value: ${{ jobs.select.outputs.container_runner }}
permissions: {}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
      container_runner: ${{ steps.choose.outputs.container_runner }}
    steps:
      - id: choose
        name: Choose runner labels
        env:
          LOCAL_RUNNER_LABELS: '["self-hosted", "macOS", "macmini"]'
          FORCE_HOSTED: ${{ inputs.force_hosted || false }}
          TRUSTED: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          runner = ["macos-15"]
          container_runner = ["ubuntu-latest"]
          if os.environ.get("TRUSTED") == "true" and os.environ.get("FORCE_HOSTED") != "true":
              try:
                  runner = json.loads(os.environ.get("LOCAL_RUNNER_LABELS", ""))
                  if not isinstance(runner, list) or not all(isinstance(label, str) for label in runner):
                      raise ValueError("Runner labels must be strings")
                  if not {"self-hosted", "macOS", "macmini"} <= set(runner):
                      raise ValueError("Required runner labels missing")
              except (ValueError, TypeError):
                  sys.exit("::error::Configure LOCAL_RUNNER_LABELS in mac-mini-ci.yml with self-hosted, macOS and macmini; verify the registered runner has these labels or dispatch with force_hosted=true.")
              container_runner = runner
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"runner={json.dumps(runner)}\n")
              output.write(f"container_runner={json.dumps(container_runner)}\n")
          print(f"Selected runner: {json.dumps(runner)}; container: {json.dumps(container_runner)}")
          PY
  verify:
    needs: select
    runs-on: ${{ fromJSON(needs.select.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Show runner environment
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          printf 'Runner: %s\n' "$RUNNER_NAME"
          uname -m
          sw_vers
    if: ${{ !inputs.selector_only }}
