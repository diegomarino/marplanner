openapi: 3.1.0
info:
  title: Marplanner — Network Devices API
  version: 1.0.0
  description: >-
    Registered network devices, live controller inventory and block state. Every management route
    requires a management credential and network:admin capability. Provider failures use safe typed
    errors.
servers:
  - url: /
components:
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    LiveCacheState:
      type: string
      enum:
        - unconfigured
        - cold
        - stale
        - freshEmpty
        - fresh
    LiveClient:
      type: object
      required:
        - mac
        - displayName
        - isBlocked
      additionalProperties: false
      properties:
        mac:
          type: string
          description: canonical lowercase colon-separated
        displayName:
          type:
            - string
            - "null"
        isBlocked:
          type: boolean
    RegisteredDevice:
      type: object
      required:
        - id
        - mac
        - alias
        - memberId
        - memberLabel
        - memberInactive
        - isBlocked
        - beliefDiverged
        - lastSeenAt
        - liveStatus
      additionalProperties: false
      properties:
        id:
          type: string
        mac:
          type: string
        alias:
          type: string
        memberId:
          type:
            - string
            - "null"
        memberLabel:
          type:
            - string
            - "null"
        memberInactive:
          type: boolean
        isBlocked:
          type: boolean
          description: the local BELIEF mirror (INV-04)
        beliefDiverged:
          type: boolean
          description: >-
            true when a mirror write failed after controller success (AC-02); cleared by the
            converging poll
        lastSeenAt:
          type:
            - integer
            - "null"
          description: epoch ms, observation-only (INV-10)
        liveStatus:
          type: string
          enum:
            - online
            - notDetected
            - unknown
          description: derived at read time, never persisted (INV-04)
    RegisterDeviceRequest:
      type: object
      required:
        - mac
        - alias
      additionalProperties: false
      properties:
        mac:
          type: string
          description: must be present in the CURRENT fresh live cache (AC-03) — otherwise 409 reselect
        alias:
          type: string
          minLength: 1
          maxLength: 80
        memberId:
          type:
            - string
            - "null"
          description: must resolve to an ACTIVE member (AC-07)
    EditDeviceRequest:
      type: object
      additionalProperties: false
      properties:
        alias:
          type: string
          minLength: 1
          maxLength: 80
        memberId:
          type:
            - string
            - "null"
      description: The MAC is NOT editable — no property for it exists (INV-02).
    ErrorResponse:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          description: machine code; `reselect_required` is the dedicated cache-rotation rejection (AC-03)
    ControllerErrorResponse:
      type: object
      required:
        - error
        - code
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          description: >-
            machine code identifying which controller-degradation state this 502 represents —
            `controller_unavailable`, `controller_rejected`, or `controller_unreachable` (the three
            `NetworkDeviceController*Error` classes in src/server/modules/network-devices/index.ts,
            mapped via src/server/routes/network-devices.ts). Unlike the shared ErrorResponse, both
            fields are ALWAYS present on this response — every 502-mapped error class carries its
            own `code`.
    NetworkDevicesListResponse:
      type: object
      required:
        - devices
        - cacheState
      additionalProperties: false
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/RegisteredDevice"
        cacheState:
          $ref: "#/components/schemas/LiveCacheState"
    LiveClientsResponse:
      type: object
      required:
        - state
        - clients
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/LiveCacheState"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/LiveClient"
security:
  - deviceKeyCookie: []
paths:
  /api/network-devices:
    get:
      summary: List the curated registry with derived live status (ZERO writes — INV-05)
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDevicesListResponse"
        "403":
          description: unauthenticated, unknown or out-of-scope key rejected (AC-06)
    post:
      summary: Register a device from the fresh picker cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDevice"
        "400":
          description: validation (alias, inactive member)
        "403":
          description: device-kind key rejected
        "409":
          description: MAC not in the current fresh cache (`reselect_required`) or already registered (INV-01)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/network-devices/live-clients:
    get:
      summary: Picker feed — the controller's current live clients
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveClientsResponse"
        "403":
          description: device-kind key rejected
  /api/network-devices/{id}:
    patch:
      summary: Edit alias/assignment (local-only; MAC immutable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditDeviceRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDevice"
        "400":
          description: validation (inactive member on NEW assignment)
        "403":
          description: device-kind key rejected
        "404":
          description: unknown device
    delete:
      summary: Delete (local-only — NO controller call ever, AC-04)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "204":
          description: always succeeds locally, blocked devices included
        "403":
          description: device-kind key rejected
        "404":
          description: unknown device
  /api/network-devices/{id}/block:
    post:
      summary: Block internet for the device (intent → controller → mirror)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: >-
            Controller accepted; body reflects the belief (possibly beliefDiverged when the mirror
            write failed — AC-02).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDevice"
        "403":
          description: device-kind key rejected
        "404":
          description: unknown device
        "502":
          description: controller rejected/unreachable — nothing mirrored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerErrorResponse"
  /api/network-devices/{id}/unblock:
    post:
      summary: Restore internet (symmetric to block)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredDevice"
        "403":
          description: device-kind key rejected
        "404":
          description: unknown device
        "502":
          description: controller rejected/unreachable — nothing mirrored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerErrorResponse"
