openapi: 3.1.0
info:
  title: Marplanner — Day Periods vocabulary API
  version: 1.0.0
  description: >-
    The fixed four household day periods and their editable start times. Ordering and uniqueness are
    validated; end boundaries derive from the next start.
servers:
  - url: /
components:
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    PeriodId:
      type: string
      enum:
        - morning
        - afternoon
        - evening
        - night
      description: Stable slug of one of the four fixed periods.
    DayPeriod:
      type: object
      required:
        - id
        - labelKey
        - start
        - sortOrder
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/PeriodId"
        labelKey:
          type: string
          description: i18n translation key (INV-04); never user-editable free text.
          example: dayPeriod.morning
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Local start boundary HH:MM (the only stored boundary; end is derived).
          example: "05:00"
        sortOrder:
          type: integer
          minimum: 0
          maximum: 3
          description: Canonical cycle position (morning=0 … night=3).
    EditStartRequest:
      type: object
      required:
        - start
      additionalProperties: false
      properties:
        start:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: "11:30"
    ActivePeriodResult:
      type: object
      required:
        - activeId
      additionalProperties: false
      properties:
        activeId:
          $ref: "#/components/schemas/PeriodId"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
security:
  - deviceKeyCookie: []
paths:
  /api/day-periods:
    get:
      summary: List the four day periods (ordered by start). Public vocabulary — no PIN required.
      operationId: listDayPeriods
      responses:
        "200":
          description: Exactly four periods in ascending start order. Exposes no add/delete/reorder.
          content:
            application/json:
              schema:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  $ref: "#/components/schemas/DayPeriod"
        "401":
          description: Missing/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/day-periods/{id}:
    patch:
      summary: Edit one period's start boundary (validated strict order + uniqueness).
      operationId: editDayPeriodStart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PeriodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditStartRequest"
      responses:
        "200":
          description: The updated period. Neighbours' derived ends follow (re-read via GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayPeriod"
        "400":
          description: Strict-order or uniqueness violation — nothing persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown period id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/day-periods/active:
    get:
      summary: The active period now, in the household timezone (server-authoritative, Option C).
      operationId: getActiveDayPeriod
      responses:
        "200":
          description: The latest period whose start <= now; before the first start, the wrapping night.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePeriodResult"
        "401":
          description: Missing/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
