openapi: 3.1.0
info:
  title: Marplanner — Daily Messages API
  version: 1.0.0
  description: >-
    Per-member daily messages with strict dates and text validation. Writes require an active
    member; reads preserve archived-member history and reject unknown members. The device-key cookie
    authorizes backend access.
servers:
  - url: /
components:
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    DailyMessage:
      type: object
      required:
        - id
        - memberId
        - date
        - text
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        memberId:
          type: string
        date:
          type: string
          description: YYYY-MM-DD (household-local)
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: stored verbatim.
        createdAt:
          type: integer
        updatedAt:
          type: integer
    DailyMessageUpsert:
      type: object
      additionalProperties: false
      required:
        - memberId
        - date
        - text
      properties:
        memberId:
          type: string
          description: must reference an active members.id.
        date:
          type: string
          description: YYYY-MM-DD (household-local)
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            stored byte-for-byte verbatim (AC-07). Blank-after-trim / over-500-char rejection
            (AC-03/FR-005) is enforced on writes.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
          description: English diagnostic (Constitution X).
paths:
  /api/daily-messages:
    put:
      summary: >
        Create or replace the message for (memberId, date) — upsert on the UNIQUE (member_id, date)
        pair (INV-01/AC-01). A non-object/array body or an unsupported field rejects with 400
        (#397); Text, date and active-member validation are enforced on writes.
      security:
        - deviceKeyCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyMessageUpsert"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: upserted (created or replaced)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMessage"
        "400":
          description: non-object/array body, or an unsupported field (#397)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: missing/invalid device key
    get:
      summary: >
        Window list — date-ascending messages for a member over the half-open window `[from,
        from+days)`, missing dates absent (INV-08). `days` outside `[1, 60]` -> 400 (AC-05).
        Tolerant read: gates on member existence not active-status, so an archived member's
        historical rows stay readable (P2-B); an unknown member -> 404, a valid member with no
        messages -> 200 empty list (AC-04).
      security:
        - deviceKeyCookie: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM-DD (window start, inclusive)
        - name: days
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: date-ascending messages in the window (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyMessage"
        "400":
          description: days out of range, or an invalid from date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: missing/invalid device key
        "404":
          description: unknown member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: >
        Delete the message for (memberId, date) — a SEPARATE idempotent command, never implied by a
        blank write (AC-03/FR-006). A missing message OR an unknown member is a no-op success (204),
        never a 404.
      security:
        - deviceKeyCookie: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM-DD
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "204":
          description: deleted, or already absent (idempotent no-op)
        "400":
          description: missing/malformed query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: missing/invalid device key
  /api/daily-messages/current:
    get:
      summary: >
        Outbound single read — the current message for (memberId, date), computed LIVE every call
        (no stored snapshot). Consumed by Daily Briefing. Tolerant read: gates on member existence
        not active-status (INV-08/AC-04, P2-B) — an unknown member -> 404, an archived member's
        historical row stays readable.
      security:
        - deviceKeyCookie: []
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            description: YYYY-MM-DD
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: the current message, or null when the member has none that date
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DailyMessage"
                  - type: "null"
        "401":
          description: missing/invalid device key
        "404":
          description: unknown member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
