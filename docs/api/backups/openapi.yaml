openapi: 3.1.0
info:
  title: Marplanner — Backups API
  version: 1.0.0
  description: >-
    Snapshot, shelf, download, upload, delete and quiescent restore operations. Requires
    backups:admin capability. Restore validates compatibility and takes a pre-restore snapshot
    before replacing the database.
servers:
  - url: /
components:
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    BackupType:
      type: string
      enum:
        - scheduled
        - snapshot
        - pre-restore
        - upload
    BackupListItem:
      type: object
      additionalProperties: false
      required:
        - filename
        - type
        - createdAt
        - sizeBytes
      properties:
        filename:
          type: string
        type:
          $ref: "#/components/schemas/BackupType"
        createdAt:
          type: integer
        sizeBytes:
          type: integer
    BackupListResponse:
      type: object
      additionalProperties: false
      required:
        - backups
        - dbGeneration
        - lastBackupError
        - lastPruneError
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupListItem"
        dbGeneration:
          type: integer
        lastBackupError:
          type:
            - string
            - "null"
        lastPruneError:
          type:
            - string
            - "null"
    SnapshotResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - filename
          properties:
            status:
              type: string
              enum:
                - completed
            filename:
              type: string
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - already_running
    RestoreRequest:
      type: object
      additionalProperties: false
      required:
        - filename
        - confirmFilename
      properties:
        filename:
          type: string
        confirmFilename:
          type: string
    RestoreResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - dbGeneration
            - migrated
          properties:
            status:
              type: string
              enum:
                - restored
            dbGeneration:
              type: integer
            migrated:
              type: boolean
        - type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - validation_error
                - confirmation_mismatch
                - incompatible_backup
                - downgrade_rejected
                - unsupported_lineage
                - restore_in_progress
                - snapshot_in_progress
                - quiesce_timeout
                - pre_restore_failed
                - swap_failed
                - migration_failed_rolled_back
                - rollback_failed
                - retention_floor
                - protected_pre_restore
                - upload_too_large
                - backup_failed
                - not_found
            message:
              type: string
    UploadResult:
      type: object
      additionalProperties: false
      required:
        - filename
      properties:
        filename:
          type: string
    BackupsError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
security:
  - deviceKeyCookie: []
paths:
  /api/backups:
    get:
      operationId: listBackups
      summary: List the backup shelf (file-derived; backups:admin)
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Newest-first shelf listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupListResponse"
  /api/backups/snapshot:
    post:
      operationId: createSnapshot
      summary: Create a snapshot now (routes through the scheduler's manual entry)
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Completed (with filename) or an honest already_running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResult"
        "409":
          description: A restore is currently in progress; snapshots are refused until it completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "500":
          description: >
            The snapshot write itself failed (e.g. ENOSPC) — error "backup_failed". `backup_failed`
            IS a member of the closed RestoreResult error-code enum above (F7, review #636/#637) —
            included there only for that union's exhaustiveness, since `restoreDatabase` itself
            never returns it, same precedent as `upload_too_large`. The failure is also surfaced via
            GET /api/backups's lastBackupError field and server logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "503":
          description: >
            The scheduler is not available (e.g. SCHEDULER_DISABLED=1 — the default Playwright
            e2e/dev posture never calls initScheduler). A stable, English, internals-free envelope
            (review F6) — never the scheduler's raw thrown message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
  /api/backups/restore:
    post:
      operationId: restoreBackup
      summary: Restore a backup (typed-filename confirmation; ADR-017 sequence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Restored; clients should reload (dbGeneration bumped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "400":
          description: Validation error or typed-confirmation mismatch — no side effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "404":
          description: The named backup vanished between list and action (or failed the F9 hardened resolve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "409":
          description: A restore or snapshot is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "422":
          description: >-
            Incompatible backup, unsupported lineage, or downgrade rejected (fail-closed version
            gate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "500":
          description: >
            Pre-restore snapshot failed (aborted untouched); a swap failure (WAL/SHM cleanup or
            copy/rename, rolled back losslessly); or a forward migration failure (rolled back
            losslessly).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "503":
          description: >
            Either: quiesce drain deadline expired — restore aborted fail-safe, active DB untouched,
            scheduler restarted (self-resolving, retry shortly); OR the rollback itself failed
            (`rollback_failed`) — a double-fault terminal state where the server remains quiesced
            pending MANUAL recovery (never self-resolving; do not retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
  /api/backups/{filename}:
    delete:
      operationId: deleteBackup
      summary: Delete a backup (respects the retention floor; protected pre-restore refused)
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "204":
          description: Deleted.
        "400":
          description: Invalid filename (allowlist/traversal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "404":
          description: The named backup vanished between list and action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "409":
          description: >
            Floor violation (retention_floor) or a pre-restore snapshot targeted while a restore is
            in progress (protected_pre_restore).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
  /api/backups/{filename}/download:
    get:
      operationId: downloadBackup
      summary: Download a backup file (sensitive; backups:admin)
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: The backup file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid filename.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "404":
          description: The named backup vanished between list and action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
  /api/backups/{filename}/download-sql:
    get:
      operationId: downloadBackupSql
      summary: Read-only in-process SQL export (never re-importable)
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: SQL text export.
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid filename, or the file could not be read as SQLite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "404":
          description: The named backup vanished between list and action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
  /api/backups/upload:
    post:
      operationId: uploadBackup
      summary: Upload a.db backup (size-capped before writing;.sql rejected)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Stored on the shelf with an upload- prefix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Not a SQLite file / empty body (.sql is rejected via this same check).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "413":
          description: Over the size cap; zero bytes written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "415":
          description: >
            Unsupported Content-Type — this route only accepts application/octet-stream (F4,
            independent review of #639/#640).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
        "500":
          description: >
            An unexpected failure inside the upload route (e.g. a disk write or rename failure). A
            stable, English, internals-free upload_failed envelope — never the raw thrown message
            (F4, independent review of #639/#640).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsError"
