openapi: 3.1.0
info:
  title: Marplanner foundation API
  version: 1.0.0
  description: >-
    Health, frontend access, device provisioning, PIN verification and household settings. Device
    cookies authorize the API. Effective settings contain only active contributions; the UI PIN is
    advisory.
servers:
  - url: /
components:
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
      description: >
        The minted `*` device key (an `mpk-…` value). Set HttpOnly+Secure+SameSite=Lax at
        provisioning; never readable by client JS and never echoed in any response body.
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  schemas:
    AuthForbidden:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - code
      properties:
        error:
          const: forbidden
        message:
          type: string
        code:
          type: string
          enum:
            - credential_invalid
            - scope_denied
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ProvisionResult:
      type: object
      required:
        - provisioned
      properties:
        provisioned:
          type: boolean
          const: true
      description: >
        Success body carries NO raw key — the minted device key is delivered only via Set-Cookie
        (FR-007). The raw key never appears here or in any error body (SC-004).
    LocaleObject:
      type: object
      required:
        - timezone
        - language
        - weekStartDay
      properties:
        timezone:
          type: string
          example: Europe/Madrid
        language:
          type: string
          example: es
        weekStartDay:
          type: integer
          enum:
            - 0
            - 1
          example: 1
      description: All three fields always present; defaults fill unset values (FR-010/011).
    EffectiveSettings:
      type: object
      required:
        - locale
      properties:
        locale:
          $ref: "#/components/schemas/LocaleObject"
      description: >
        The core locale settings object with defaults filled on read. Plugin-owned objects are
        included only when their installed plugins are active.
    WriteSettingsRequest:
      type: object
      required:
        - object
        - settings
      additionalProperties: false
      properties:
        object:
          type: string
          description: >
            Registered object name. Core locale is always available; inactive plugin-owned objects
            are not projected by GET /api/settings.
          enum:
            - locale
            - weather
            - printer
            - printerTransport
        settings:
          type: object
          description: >
            Complete replacement object. The Settings domain rejects unknown or invalid fields and
            writes a valid object atomically.
    VerifyPinRequest:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
    VerifyPinResult:
      type: object
      required:
        - match
      properties:
        match:
          type: boolean
      description: Advisory only — no session is created; grants no backend authority (FR-016/026).
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
      description: Error bodies never contain `mpk-`/`mpg-` values or raw PINs (SC-004).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness — the ONLY unauthenticated route (allowlisted).
      security: []
      responses:
        "200":
          description: Always reachable, even with no credential configured (FR-002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/auth/provision:
    post:
      operationId: provisionDevice
      summary: First connect — present the raw `*` bootstrap key, mint a cookie-bound device key.
      security: []
      description: >
        Validates the presented raw `*` key against the configured bootstrap credential. On success
        mints a no-expiry `*` device key, persists only its hash, and returns it via Set-Cookie.
        Fail-closed: an absent/invalid key yields 401 and the deployment stays locked
        (FR-003/004/007).
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Bearer mpk-cedar-lantern-otter-ridge-velvet-amber
          description: The raw `*` bootstrap key. Never logged; never returned.
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Provisioned. Device key delivered via Set-Cookie; body has no raw key.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: mp_device_key=mpk-…; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResult"
        "401":
          description: Missing/invalid bootstrap key — locked, never open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings:
    get:
      operationId: getSettings
      summary: Cold-readable effective settings (valid key only; no admin session/PIN).
      security:
        - deviceKeyCookie: []
      description: Available at cold boot with a valid key and no PIN (FR-008/009/011).
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Effective settings including the fully-populated locale object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveSettings"
        "401":
          description: No/invalid key (PIN state is irrelevant to this outcome).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Revoked/expired credential or denied capability; code distinguishes credential loss from
            scope denial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForbidden"
    put:
      operationId: putSettings
      summary: Replace one registered settings object.
      security:
        - deviceKeyCookie: []
      description: >
        Validates the envelope and entire object before persisting it. Successful writes return the
        current effective settings projection. Unknown object names and invalid settings fail without
        a partial write. The UI PIN does not authorize this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteSettingsRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Effective settings after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveSettings"
        "400":
          description: Invalid envelope, unknown object, or invalid settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected persistence or server failure; details are not exposed in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/verify-pin:
    post:
      operationId: verifyPin
      summary: Advisory client-side-gate helper — compares the PIN, returns match/no-match.
      security:
        - deviceKeyCookie: []
      description: >
        Authorized by the device key like every endpoint. Compares the submitted PIN to the stored
        hash and returns `{ match }`. Creates NO session row and grants NO authority; the PIN is
        never an authorization input (FR-014/015/016/026).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPinRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Correct PIN → match true; incorrect PIN → match false. No state written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPinResult"
        "401":
          description: No/invalid device key (independent of PIN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
