openapi: 3.1.0
info:
  title: Marplanner — Daily Briefing API
  version: 1.0.0
  description: >-
    Member briefing generation, opt-in settings, snapshots and status. Calendar, chores, reminders,
    meals and messages are read through their owning domain interfaces.
servers:
  - url: /
components:
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    BlockParams:
      type: object
      additionalProperties: false
      description: >-
        Closed per-instance params (mirrors settings.ts ALLOWED_PARAM_KEYS; unknown keys are rejected
        400 by validateParams —  fold closed this schema to match).
      properties:
        level:
          type: string
          enum:
            - L1
            - L2
            - L3
            - L4
        difficulty:
          type: string
        language:
          type: string
          description: validated against corpus availability (FR-009)
    BriefingStatus:
      type: string
      enum:
        - pending
        - ready
        - partial
        - failed
        - render-failed
    BlockType:
      type: string
      enum:
        - calendar
        - chores
        - shotgun
        - message
        - streak
        - today
        - weather
        - meals
        - birthday
        - reminders
        - dadJoke
        - wordOfDay
        - animalFact
        - numberFact
        - onThisDay
        - quoteOfDay
        - trivia
        - riddle
        - wouldYouRather
        - wordSearch
        - drawingPrompt
        - streakText
        - weatherText
    BlockScope:
      type: string
      enum:
        - shared
        - member
    WeatherConditionKey:
      type: string
      enum:
        - clear
        - mostlyClear
        - partlyCloudy
        - overcast
        - fog
        - drizzle
        - freezingDrizzle
        - rain
        - freezingRain
        - snow
        - snowGrains
        - rainShowers
        - snowShowers
        - thunderstorm
        - thunderstormHail
        - unknown
    WeatherBlockPayload:
      description: >
        The `data` shape of a `BlockInstance` whose `type` is `weather` (, the Weather domain
        contract). Present only when the household's forecast `daily[]` covers the briefing's
        household-local `date` (WEATHER-INV-05); frozen once written (WEATHER-INV-09) — regeneration
        is the only refresh. `BlockInstance.data` stays the generic `[object, array, 'null']` schema
        above (untyped per-type, matching every other block type's precedent) — this schema
        documents what a `weather`-typed block's `data` actually contains (the route-only drift gate
        cannot see this body-shape change, hence the explicit ripple-edit).
      type: object
      additionalProperties: false
      required:
        - date
        - conditionKey
        - tempMinC
        - tempMaxC
        - rainPct
      properties:
        date:
          type: string
          description: YYYY-MM-DD, household tz
        conditionKey:
          $ref: "#/components/schemas/WeatherConditionKey"
        tempMinC:
          type: number
        tempMaxC:
          type: number
        rainPct:
          type: integer
          minimum: 0
          maximum: 100
    BlockInstance:
      type: object
      required:
        - type
        - scope
        - status
      properties:
        type:
          $ref: "#/components/schemas/BlockType"
        scope:
          $ref: "#/components/schemas/BlockScope"
        status:
          type: string
          enum:
            - ok
            - failed
        data:
          description: Frozen block data, present for successful blocks.
        error:
          type: string
        index:
          type: integer
          minimum: 1
        title:
          type: string
        language:
          type: string
        params:
          $ref: "#/components/schemas/BlockParams"
      additionalProperties: false
    MemberIdentitySnapshot:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
      additionalProperties: false
    BriefingPayload:
      type: object
      required:
        - schemaVersion
        - member
        - date
        - blocks
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
            - 2
        member:
          $ref: "#/components/schemas/MemberIdentitySnapshot"
        date:
          type: string
          description: YYYY-MM-DD household-tz business date
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/BlockInstance"
      allOf:
        - if:
            properties:
              schemaVersion:
                const: 1
            required:
              - schemaVersion
          then:
            properties:
              blocks:
                items:
                  properties:
                    type:
                      enum:
                        - calendar
                        - reminders
                        - chores
                        - meals
                        - weather
          else:
            properties:
              blocks:
                items:
                  properties:
                    type:
                      enum:
                        - shotgun
                        - message
                        - streak
                        - today
                        - weather
                        - meals
                        - birthday
                        - reminders
                        - dadJoke
                        - wordOfDay
                        - animalFact
                        - numberFact
                        - onThisDay
                        - quoteOfDay
                        - trivia
                        - riddle
                        - wouldYouRather
                        - wordSearch
                        - drawingPrompt
                        - streakText
                        - weatherText
      additionalProperties: false
    Briefing:
      type: object
      required:
        - id
        - memberId
        - date
        - status
        - payload
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        memberId:
          type: string
        date:
          type: string
        status:
          $ref: "#/components/schemas/BriefingStatus"
        payload:
          $ref: "#/components/schemas/BriefingPayload"
        createdAt:
          type: integer
        updatedAt:
          type: integer
      additionalProperties: false
    BriefingReadResult:
      description: Pure read result; printedStatus is documented by the overlapping briefing-render contract.
      oneOf:
        - type: object
          required:
            - generated
          properties:
            generated:
              type: boolean
              enum:
                - false
        - type: object
          required:
            - generated
            - briefing
          properties:
            generated:
              type: boolean
              enum:
                - true
            briefing:
              $ref: "#/components/schemas/Briefing"
    GenerateInput:
      type: object
      additionalProperties: false
      required:
        - memberId
      properties:
        memberId:
          type: string
        date:
          type:
            - string
            - "null"
          description: optional YYYY-MM-DD household-tz business date; defaults to household-tz today.
    GenerateAllInput:
      type: object
      additionalProperties: false
      properties:
        date:
          type:
            - string
            - "null"
          description: optional YYYY-MM-DD household-tz business date; defaults to household-tz today.
    GenerateAllResponse:
      description: |2
         US2: routed through the background-jobs scheduler's shared in-flight guard. `already_running` means a same-job run (scheduled, catch-up, or another manual call) was already in flight — no generation happened and no duplicate rows were written.
      oneOf:
        - type: object
          required:
            - status
            - count
            - generated
          properties:
            status:
              type: string
              enum:
                - completed
            count:
              type: integer
            generated:
              type: array
              items:
                type: object
                required:
                  - memberId
                  - status
                properties:
                  memberId:
                    type: string
                  status:
                    $ref: "#/components/schemas/BriefingStatus"
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - already_running
    GenerateSkippedResponse:
      type: object
      additionalProperties: false
      required: [skipped, reason, memberId, date]
      properties:
        skipped:
          type: boolean
          const: true
        reason:
          type: string
          enum: [paused]
        memberId:
          type: string
        date:
          type: string
    BriefingHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, date, status, updatedAt]
      properties:
        id:
          type: string
        date:
          type: string
        status:
          $ref: "#/components/schemas/BriefingStatus"
        updatedAt:
          type: integer
    BriefingHistoryResponse:
      type: object
      additionalProperties: false
      required: [today, entries]
      properties:
        today:
          type: string
          description: household-timezone business date (YYYY-MM-DD).
        entries:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/BriefingHistoryEntry"
    OptInState:
      type: object
      required:
        - memberId
        - enabled
      properties:
        memberId:
          type: string
        enabled:
          type: boolean
    OptInInput:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - validation_error
        message:
          type: string
    InternalErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - internal_error
        message:
          type: string
    UnauthorizedErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - unauthorized
        message:
          type: string
        code:
          type: string
          description: >-
            machine code from the shared auth boundary (src/server/auth/boundary.ts, fix #682) —
            always `credential_invalid` on a 401 from this cross-cutting preHandler; optional here
            since older/other 401 emitters may not set it.
    ForbiddenErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum:
            - forbidden
        message:
          type: string
        code:
          type: string
          description: >-
            machine code from the shared auth boundary/capability seam (src/server/auth/boundary.ts
            + src/server/auth/capability.ts, fix #682) — `credential_invalid` (dead key:
            revoked/expired) or `scope_denied` (live key, denied on scope grounds) on a 403 from
            these cross-cutting preHandlers; optional here since older/other 403 emitters may not
            set it.
    FastifyParseErrorResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - code
        - error
        - message
      properties:
        statusCode:
          type: integer
          enum:
            - 400
        code:
          type: string
          enum:
            - FST_ERR_CTP_INVALID_JSON_BODY
            - FST_ERR_CTP_EMPTY_JSON_BODY
        error:
          type: string
          enum:
            - Bad Request
        message:
          type: string
security:
  - deviceKeyCookie: []
paths:
  /api/daily-briefing/generate:
    post:
      summary: Manually generate a briefing for one opted-in active member/date (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: generated briefing, or skipped because the member is paused on that weekday (FR-024).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Briefing"
                  - $ref: "#/components/schemas/GenerateSkippedResponse"
        "400":
          description: invalid input, invalid date, inactive member, or member not opted-in.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/FastifyParseErrorResponse"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/daily-briefing/generate-all:
    post:
      summary: Generate briefings for every active opted-in member (admin).
      description: >
        Eligibility is active AND explicitly opted-in; opted-in archived members are skipped. The
        request date is strictly validated before candidate enumeration. Runs through the
        background-jobs scheduler's shared in-flight guard ( US2, ADR-014): a same-job run already
        in flight (scheduled, catch-up, or another manual call) returns `{status:"already_running"}`
        at 200 instead of racing a second generation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAllInput"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: generated briefing summary, or an already_running guard response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateAllResponse"
        "400":
          description: invalid date or unknown request property.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/FastifyParseErrorResponse"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/daily-briefing/opt-in:
    get:
      summary: List persisted Daily Briefing opt-in states (admin).
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: explicit per-member opt-in states; absent rows remain opt-out by default.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptInState"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/daily-briefing/opt-in/{memberId}:
    put:
      summary: Set a member's Daily Briefing opt-in (admin).
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptInInput"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: updated opt-in state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptInState"
        "400":
          description: invalid input or inactive member.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/FastifyParseErrorResponse"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/daily-briefing/history/{memberId}:
    get:
      summary: List a member's latest briefings, newest first (admin, FR-026).
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: household today plus at most 30 history entries; a pure read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingHistoryResponse"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
  /api/daily-briefing/{memberId}/{date}:
    get:
      summary: Read a member/date briefing without generating one.
      description: Strictly validates the YYYY-MM-DD calendar date; a missing briefing remains a pure read.
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: generated briefing or the pure missing result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingReadResult"
        "400":
          description: invalid strict calendar date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: missing or invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorResponse"
        "403":
          description: revoked or expired device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "500":
          description: unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
