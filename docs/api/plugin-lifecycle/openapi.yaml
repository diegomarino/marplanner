openapi: 3.1.0
info:
  title: Marplanner Plugin Lifecycle API
  version: 1.0.0
  description: >-
    Authenticated first-party plugin catalog and lifecycle mutations for. Canonical plugin state is
    active, inactive, or errored; operation is a separate transient projection. The API never
    accepts or returns the admin PIN or raw errors.
servers:
  - url: /
security:
  - deviceSession: []
  - integrationKey: []
paths:
  /api/plugins:
    get:
      operationId: listPlugins
      summary: List the exact delivered first-party plugin catalog
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Authenticated catalog in manifest order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - plugins
                properties:
                  plugins:
                    type: array
                    minItems: 9
                    maxItems: 9
                    items:
                      $ref: "#/components/schemas/PluginCatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/FullAccessRequired"
        "503":
          $ref: "#/components/responses/CatalogUnavailable"
  /api/plugins/{pluginId}/activate:
    post:
      operationId: activatePlugin
      summary: Idempotently activate one delivered plugin
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Current terminal plugin representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/FullAccessRequired"
        "404":
          $ref: "#/components/responses/PluginNotFound"
        "409":
          $ref: "#/components/responses/PluginBusy"
        "503":
          $ref: "#/components/responses/MutationUnavailable"
  /api/plugins/{pluginId}/deactivate:
    post:
      operationId: deactivatePlugin
      summary: Idempotently deactivate one delivered plugin after bounded drain
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Current terminal plugin representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/FullAccessRequired"
        "404":
          $ref: "#/components/responses/PluginNotFound"
        "409":
          $ref: "#/components/responses/PluginBusy"
        "503":
          $ref: "#/components/responses/MutationUnavailable"
  /api/plugins/{pluginId}/fault:
    post:
      operationId: reportPluginFault
      summary: Report an allow-listed client contribution fault without raw details
      parameters:
        - $ref: "#/components/parameters/PluginId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - contribution_render_failed
                    - contribution_start_failed
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "204":
          description: Fault contained or already contained
        "400":
          description: Body contains an unknown field, raw detail, or unsupported code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/FullAccessRequired"
        "404":
          $ref: "#/components/responses/PluginNotFound"
        "409":
          $ref: "#/components/responses/PluginBusy"
        "503":
          $ref: "#/components/responses/MutationUnavailable"
components:
  securitySchemes:
    deviceSession:
      type: apiKey
      in: cookie
      name: mp_device_key
      description: Existing device-session cookie whose live scopes include `*`.
    integrationKey:
      type: http
      scheme: bearer
      description: Existing raw-header integration credential whose live scopes include `*`.
  parameters:
    PluginId:
      name: pluginId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PluginId"
  schemas:
    PluginId:
      type: string
      enum:
        - daily-briefing
        - printing
        - weather
        - time-announcements
        - backups
        - network-devices
        - meals-recipes
        - reminders
        - daily-messages
    PluginState:
      type: string
      enum:
        - active
        - inactive
        - errored
    PluginOperation:
      type: object
      additionalProperties: false
      required:
        - targetState
        - startedAt
      properties:
        targetState:
          type: string
          enum:
            - active
            - inactive
        startedAt:
          type: string
          format: date-time
    PluginHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - code
      properties:
        status:
          type: string
          enum:
            - healthy
            - attention
        code:
          oneOf:
            - $ref: "#/components/schemas/PluginPublicErrorCode"
            - type: "null"
    PluginPublicErrorCode:
      type: string
      enum:
        - settings_initialization_failed
        - migration_failed
        - runtime_mount_failed
        - drain_failed
        - runtime_unmount_failed
        - contribution_failed
        - reconciliation_failed
    PluginPublicError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/PluginPublicErrorCode"
        message:
          type: string
          enum:
            - Plugin settings could not be prepared.
            - Plugin data could not be prepared.
            - Plugin services could not be started.
            - Plugin work could not stop safely.
            - Plugin services could not be stopped.
            - A plugin contribution failed.
            - Plugin recovery requires attention.
    PluginCatalogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - description
        - trustTier
        - contributions
        - requirements
        - settingsSchema
        - state
        - operation
        - health
        - updatedAt
        - error
      properties:
        id:
          $ref: "#/components/schemas/PluginId"
        label:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        trustTier:
          type: string
          const: first-party
        contributions:
          $ref: "#/components/schemas/PluginContributionSummary"
        requirements:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        settingsSchema:
          type: array
          items:
            $ref: "#/components/schemas/PluginSettingDescriptor"
        state:
          $ref: "#/components/schemas/PluginState"
        operation:
          oneOf:
            - $ref: "#/components/schemas/PluginOperation"
            - type: "null"
        health:
          $ref: "#/components/schemas/PluginHealth"
        updatedAt:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/PluginPublicError"
            - type: "null"
    PluginContributionSummary:
      type: object
      additionalProperties: false
      required:
        - routes
        - admin
        - settings
        - widgets
        - services
        - jobs
      properties:
        routes:
          $ref: "#/components/schemas/ContributionIds"
        admin:
          $ref: "#/components/schemas/ContributionIds"
        settings:
          $ref: "#/components/schemas/ContributionIds"
        widgets:
          $ref: "#/components/schemas/ContributionIds"
        services:
          $ref: "#/components/schemas/ContributionIds"
        jobs:
          $ref: "#/components/schemas/ContributionIds"
    ContributionIds:
      type: array
      items:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      uniqueItems: true
    PluginSettingDescriptor:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - valueType
        - required
        - sensitive
      properties:
        key:
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
        label:
          type: string
          minLength: 1
        valueType:
          type: string
          enum:
            - string
            - number
            - boolean
            - enum
            - object
        required:
          type: boolean
        sensitive:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    UnauthorizedError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - code
      properties:
        error:
          type: string
          const: unauthorized
        message:
          type: string
        code:
          type: string
    ForbiddenError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - code
      properties:
        error:
          type: string
          const: forbidden
        message:
          type: string
        code:
          type: string
    PluginCatalogUnavailable:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          const: plugin_catalog_unavailable
        message:
          type: string
          const: The plugin catalog is temporarily unavailable.
    PluginLifecycleFailed:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - plugin
      properties:
        code:
          type: string
          const: plugin_lifecycle_failed
        message:
          type: string
          const: The plugin could not complete the requested lifecycle change.
        plugin:
          $ref: "#/components/schemas/PluginCatalogEntry"
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
    Unauthorized:
      description: No single valid established credential was presented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    FullAccessRequired:
      description: The authenticated credential does not contain the `*` scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    PluginNotFound:
      description: The path ID is not in the exact delivered cohort
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PluginBusy:
      description: An opposite lifecycle target is already durable for this plugin
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - code
              - message
              - plugin
            properties:
              code:
                type: string
                const: plugin_lifecycle_busy
              message:
                type: string
                const: A lifecycle operation is already in progress for this plugin.
              plugin:
                $ref: "#/components/schemas/PluginCatalogEntry"
    CatalogUnavailable:
      description: The safe catalog snapshot could not be read
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PluginCatalogUnavailable"
    MutationUnavailable:
      description: Lifecycle work failed safely or the pre-operation catalog snapshot was unavailable
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/PluginLifecycleFailed"
              - $ref: "#/components/schemas/PluginCatalogUnavailable"
