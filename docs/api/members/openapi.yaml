openapi: 3.1.0
info:
  title: Marplanner — Members referential root API
  version: 1.0.0
  description: >-
    Member creation, editing, archive and restore. Member roles and lifecycle are validated
    independently from API credential capabilities. Historical records remain readable after
    archival.
servers:
  - url: /
components:
  responses:
    AuthenticationBackoff:
      description: >
        Repeated credential failures from this transport source. Valid active credentials remain
        usable; this is failure-only retry backpressure, not a hard guess or request-volume limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
          description: Remaining cooldown in seconds, rounded up. Retry manually.
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error:
                type: string
                const: too_many_requests
              message:
                type: string
                const: Authentication retry required
  securitySchemes:
    deviceKeyCookie:
      type: apiKey
      in: cookie
      name: mp_device_key
  schemas:
    AuthForbidden:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - code
      properties:
        error:
          const: forbidden
        message:
          type: string
        code:
          type: string
          enum:
            - credential_invalid
            - scope_denied
    MemberColorKey:
      type: string
      description: Curated screen identity only; never a CSS value or a monochrome print input.
      enum:
        - blue
        - sky
        - teal
        - green
        - lime
        - amber
        - orange
        - red
        - pink
        - violet
    BirthDate:
      type: object
      required:
        - month
        - day
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
          description: calendar-valid for the month (app layer)
        year:
          type:
            - integer
            - "null"
          description: present only when known; null = no age, never invented (MEMBERS-AC-07)
      description: |
        Month/day always present when set; year optional. Feb 29 allowed with a null year.
    Member:
      type: object
      required:
        - id
        - displayName
        - role
        - lifecycle
        - colorKey
        - createdAt
        - updatedAt
      properties:
        id:
          oneOf:
            - type: string
              format: uuid
            - type: string
              pattern: ^demo:member:[a-z0-9][a-z0-9-]*$
          description: >-
            Public creation generates UUIDs; the maintained public seed uses stable demo:member
            identities. Restores preserve those identities.
        displayName:
          type: string
        colorKey:
          $ref: "#/components/schemas/MemberColorKey"
        role:
          type: string
          enum:
            - parent
            - child
        lifecycle:
          type: string
          enum:
            - active
            - archived
          description: archive/restore transitions implemented (MEMBERS-INV-04)
        birthDate:
          oneOf:
            - $ref: "#/components/schemas/BirthDate"
            - type: "null"
          description: null/absent when unset (FR-009a clear).
        createdAt:
          type: integer
        updatedAt:
          type: integer
    CreateMemberRequest:
      type: object
      required:
        - displayName
        - role
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
        colorKey:
          $ref: "#/components/schemas/MemberColorKey"
          description: >-
            Optional explicit key. If omitted, choose the first unused active-member key in palette
            order, or active-member count modulo ten after exhaustion. Archived members do not
            reserve keys. An explicit key that another active member holds is rejected (400) while
            any key is still unused.
        role:
          type: string
          enum:
            - parent
            - child
          description: admin is rejected (MEMBERS-AC-01)
        birthDate:
          oneOf:
            - $ref: "#/components/schemas/BirthDate"
            - type: "null"
          description: optional birth date; null or absent = no birth date set.
    UpdateMemberRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
        colorKey:
          $ref: "#/components/schemas/MemberColorKey"
          description: >-
            A curated key; duplicates are allowed. Omission preserves the existing key, as do
            archive and restore.
        role:
          type: string
          enum:
            - parent
            - child
        birthDate:
          oneOf:
            - $ref: "#/components/schemas/BirthDate"
            - type: "null"
          description: null explicitly clears the birth date (FR-009a). Omitted fields are unchanged.
      description: Partial profile update. Must include at least one field; role=admin rejected.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
paths:
  /api/members:
    get:
      operationId: listMembers
      summary: List all members (active and archived).
      security:
        - deviceKeyCookie: []
      description: >
        Default (no lifecycle param or lifecycle=active) returns ACTIVE members only.
        lifecycle=archived → archived only; lifecycle=all → all members. Any other value returns 400
        (invalid filter).
      parameters:
        - in: query
          name: lifecycle
          required: false
          schema:
            type: string
            enum:
              - active
              - archived
              - all
            default: active
          description: Filter by lifecycle (active/archived/all).
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: The member list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "400":
          description: Invalid lifecycle filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Revoked/expired credential or denied capability; code distinguishes credential loss from
            scope denial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForbidden"
    post:
      operationId: createMember
      summary: Create a Member (optionally with a birth date and colour key).
      security:
        - deviceKeyCookie: []
      description: >-
        One member profile in a single transaction, no Daily Briefing side effects. role=admin
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "201":
          description: Created (lifecycle active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Validation error — role=admin, unknown role, blank name, invalid birth date or colour key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/members/{id}:
    patch:
      operationId: updateMember
      summary: Edit a member profile (displayName, role, colorKey, birthDate incl. clear).
      security:
        - deviceKeyCookie: []
      description: >
        Partial update. Send `birthDate:null` to clear the birth date (FR-009a). No downstream side
        effects. Returns 404 if member not found; 400 for validation errors (invalid date,
        role=admin, no fields to update).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Validation error (invalid date, role=admin, no fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/members/{id}/archive:
    post:
      operationId: archiveMember
      summary: Archive a member (active → archived). Idempotent.
      security:
        - deviceKeyCookie: []
      description: >
        Single-row atomic transition; never a hard delete (MEMBERS-INV-04). Re-archiving an already
        archived member is a no-op success (returns current state without updating updated_at).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Member archived (or already archived — no-op).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/members/{id}/restore:
    post:
      operationId: restoreMember
      summary: Restore an archived member (archived → active). Idempotent.
      security:
        - deviceKeyCookie: []
      description: >
        Reverses archive (FR-004). Re-restoring an already active member is a no-op success (returns
        current state without updating updated_at). An archived member holds no colour key: if
        another active member took theirs meanwhile, the restored member's `colorKey` becomes the
        first unused one.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "429":
          $ref: "#/components/responses/AuthenticationBackoff"
        "200":
          description: Member restored (or already active — no-op).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: No/invalid device key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
