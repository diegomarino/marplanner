    note: >-
      Daily Briefing owns the per-member opt-in eligibility rule via its own invariants;
      Members' Coordinate-With-Daily-Briefing behavior already disclaims. Retired at 0b to
      avoid injecting a redundant foreign invariant into Daily Briefing's list. (Refinement
      of the ratified "move": the rule already lives at the destination.)

