  # ── Auth & Sessions domain — design (Tier-0 platform; active, locally owned) ─────
  # 20 in-G AUTH-SESSIONS guarantees (12 INV + 8 AC) realized by docs/features/auth-sessions.md.
  # No moved-in or pre-existing Phase-0b entries for this domain; all fresh.
  - id: AUTH-SESSIONS-INV-01
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "API key is the sole backend authorization boundary; authority bounded by scopes. Boundary scoped to /api/* (frontend serving is the access gate's concern, ADR-031) — ADR-059; spec coverage unchanged."
  - id: AUTH-SESSIONS-INV-02
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "PIN never evaluated by backend; client-side UI state only."
  - id: AUTH-SESSIONS-INV-03
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "No server-side session table, no x-session-id, no server session lifecycle."
  - id: AUTH-SESSIONS-INV-04
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Fail-closed in every environment; missing credential locks (only /health), never opens. Root /health stays the sole credential-free route after the /api migration — ADR-059."
  - id: AUTH-SESSIONS-INV-05
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Endpoint with no declared capability rejects all requests (fail-closed default)."
  - id: AUTH-SESSIONS-INV-06
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Key-management requires raw `*` header key; never cookie; never scoped-delegable."
  - id: AUTH-SESSIONS-INV-07
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Last active `*` key cannot be revoked or expired (anti-lockout)."
  - id: AUTH-SESSIONS-INV-08
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Single household trust tier; key-management is the sole operator boundary; no ad-hoc admin carve-outs."
  - id: AUTH-SESSIONS-INV-09
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Every request re-validates credential AND key-record active; revoke/expiry effective next request."
  - id: AUTH-SESSIONS-INV-10
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Device keys never exposed; integration keys shown once; raw PINs never persisted/returned."
  - id: AUTH-SESSIONS-INV-11
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "All auth state in the database; none in process memory."
  - id: AUTH-SESSIONS-INV-12
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Telemetry/logs never contain raw PINs, API keys, cookies, or access-gate tokens."
  - id: AUTH-SESSIONS-AC-01
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "No credential (any env) → non-health endpoints 401/403; deployment locked, never open."
  - id: AUTH-SESSIONS-AC-02
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Scoped key outside scope / at key-mgmt, or cookie at key-mgmt → rejected."
  - id: AUTH-SESSIONS-AC-03
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Endpoint with no declared capability → rejects all requests."
  - id: AUTH-SESSIONS-AC-04
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Revoked device key → its cookie fails on the next request."
  - id: AUTH-SESSIONS-AC-05
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Only one `*` key remaining → revocation refused."
  - id: AUTH-SESSIONS-AC-06
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "First connect with raw `*` key → `*` device key (no expiry) minted + cookie-bound; no raw key in body."
  - id: AUTH-SESSIONS-AC-07
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "verify-pin correct → match; no session row created anywhere."
  - id: AUTH-SESSIONS-AC-08
    disposition: active
    owner: auth-sessions
    spec: auth-sessions
    note: "Backend authorization never depends on PIN state."

