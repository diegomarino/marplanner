# Stable boundary guarantee identities and ownership.
# This ledger records contract guarantees; it is not instrumented coverage or proof.
# Owning boundary, integration and browser tests establish implemented support.
# `spec` remains a logical domain key; maintained feature pages live in docs/features/.
# See docs/quality/verification.md for exact discovery and coverage rules.

guarantees:
